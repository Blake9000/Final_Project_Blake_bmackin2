{% extends "base.html" %}
{% block title %}Login · Net Toolkit{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <div class="card bg-surface border-secondary">
      <div class="card-header border-secondary fw-semibold">
        <i class="bi bi-shield-lock me-1"></i>Login
      </div>
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input name="username" class="form-control bg-dark text-light border-secondary" autocomplete="username" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input name="password" type="password" class="form-control bg-dark text-light border-secondary" autocomplete="current-password" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">
            <i class="bi bi-box-arrow-in-right me-1"></i>Sign in
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
